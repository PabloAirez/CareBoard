services:
  postgres:
    image: postgres:16
    container_name: careboard_postgres
    restart: always
    environment:
      POSTGRES_DB: careboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: careboard_api
    restart: always
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DB_HOST: careboard_postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: careboard
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TZ: America/Sao_Paulo
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install --no-fund --no-audit && npm run start:dev"

  frontend:
    build:
      context: ./frontend
    container_name: careboard_frontend
    restart: always
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-fund --no-audit && npm run dev -- --host"

volumes:
  postgres_data:
  api_node_modules:
  frontend_node_modules:
